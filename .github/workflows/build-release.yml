name: Build & Package DeepDive

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'

jobs:
  # ============================================================================
  # Windows: MSVC 2022 + NSIS Installer + Portable ZIP
  # ============================================================================
  build-windows:
    name: Windows (MSVC 2022 - NSIS & ZIP)
    runs-on: windows-2022
    steps:
      - name: Checkout (full history for git commit count)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (Test-Path "$nsisDir\makensis.exe") {
            Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          } elseif (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          }

      - name: Configure (Visual Studio 2022 x64)
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Package (NSIS + Portable ZIP)
        shell: pwsh
        run: |
          cpack --config build/CPackConfig.cmake -C Release -G "NSIS;ZIP" -B dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepDive-Windows
          path: |
            dist/*.exe
            dist/*.zip

  # ============================================================================
  # Ubuntu: GCC + Ninja + DEB + tar.xz
  # ============================================================================
  build-ubuntu:
    name: Ubuntu 24.04 (DEB & tar.xz)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history for git commit count)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build & Qt6 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config dpkg-dev file xz-utils \
            qt6-base-dev qt6-multimedia-dev libgl-dev libopengl-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Package (DEB + tar.xz)
        run: |
          cpack --config build/CPackConfig.cmake -G "DEB;TXZ" -B dist

      - name: Verify DEB metadata
        run: |
          dpkg-deb --info dist/*.deb

      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepDive-Ubuntu
          path: |
            dist/*.deb
            dist/*.tar.xz

  # ============================================================================
  # macOS: Apple Clang + .app Bundle + DMG (DragNDrop) + Portable ZIP
  # ============================================================================
  build-macos:
    name: macOS (DMG & ZIP)
    runs-on: macos-15
    steps:
      - name: Checkout (full history for git commit count)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Build
        run: |
          cmake --build build --parallel $(sysctl -n hw.ncpu)

      - name: Package (DMG + Portable ZIP)
        run: |
          # Повторная попытка для DragNDrop на случай кратковременной блокировки hdiutil Spotlight-ом
          for i in 1 2 3; do
            cpack --config build/CPackConfig.cmake -G "DragNDrop" -B dist && break
            echo "hdiutil busy, retrying ($i/3)..."
            sleep 5
          done
          cpack --config build/CPackConfig.cmake -G "ZIP" -B dist

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepDive-macOS
          path: |
            dist/*.dmg
            dist/*.zip

  # ============================================================================
  # GitHub Release (автоматически при пуше тега v*)
  # ============================================================================
  release:
    name: Publish GitHub Release
    needs: [ build-windows, build-ubuntu, build-macos ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for version calculation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute version & SHA-256 checksums
        id: meta
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "version=1.0.0.${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Deep Dive v${{ steps.meta.outputs.version }}"
          generate_release_notes: true
          files: release-assets/*
